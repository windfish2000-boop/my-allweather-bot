name: Daily Allweather Alert TH Time v7.1 완전판

on:
  schedule:
    - cron: '50 1 * * 1-5'  # 🇹🇭08:50 🇰🇷10:50
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pykrx pandas yfinance requests
      - name: Run Allweather v7.1
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python v7_1_final.py
