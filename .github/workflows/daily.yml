name: Daily Allweather Alert TH Time v6.2 B

on:
  schedule:
    - cron: '50 1 * * 1-5'
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies v6.2
        run: |
          pip install --upgrade pip
          pip install requests yfinance pandas pykrx
      - name: Run Telegram Bot v6.2 B option
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python "Telegram-Allweather-Th.py"
