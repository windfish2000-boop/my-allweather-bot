name: Daily Allweather Alert TH Time v7.2 위성매도 포함

on:
  schedule:
    - cron: '50 1 * * 1-5'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas yfinance requests pykrx

      - name: Run Allweather v7.2
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python Telegram-Allweather-Th.py

      - name: Save holdings for next satellite sell signal
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add holdings.json || echo "no holdings yet"
          git commit -m "update holdings.json" || echo "no changes"
          git push || echo "push failed"
