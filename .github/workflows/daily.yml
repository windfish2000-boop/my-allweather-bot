name: Daily Allweather Alert TH Time

on:
  schedule:
    - cron: '50 1 * * 1-5'  # 태국시간 08:50 = UTC 01:50, 월-금
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies (v3 no KRX login)
        run: |
          pip install requests
          pip install yfinance
          pip install pandas
      - name: Run Telegram Bot v3
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python "Telegram-Allweather-Th.py"

